name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Verify tag matches workspace version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(awk -F'"' '/^\[workspace\.package\]$/ { in_package = 1; next } /^\[/ { in_package = 0 } in_package && /^version = / { print $2; exit }' Cargo.toml)"
          test "$tag_version" = "$workspace_version" || {
            echo "tag $tag_version does not match workspace version $workspace_version" >&2
            exit 1
          }
      - name: Verify workspace packages
        run: cargo publish --locked --workspace --dry-run
      - name: Publish workspace crates in dependency order
        run: cargo publish --locked --workspace --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create GitHub release
        # Created once, here, rather than by the per-OS upload step below --
        # two matrix jobs racing to create the same release is exactly the
        # kind of thing that turns a transient network blip into a permanent
        # half-published release. `gh release view` as a fallback makes this
        # step idempotent on a re-run after a partial failure.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || gh release view "$GITHUB_REF_NAME"

  release-binaries:
    needs: publish-crate
    strategy:
      fail-fast: false
      # Native runners per target keep release builds predictable. The 0.8
      # archive contains the remote-enabled CLI and the separate graph server.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Build remote-enabled CLI
        run: cargo build -p asobi --features remote --release --locked --target ${{ matrix.target }}
      - name: Build graph server
        run: cargo build -p asobi-server --release --locked --target ${{ matrix.target }}
      - name: Package both binaries
        run: tar -czf "asobi-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" asobi asobi-server

      - name: Upload to release
        # The macOS runner's connection to api.github.com is intermittently
        # flaky (connect timeouts, not an auth or content problem) -- retry a
        # few times with backoff rather than failing the whole release on a
        # transient network blip. `--clobber` makes a retry after a partial
        # upload safe to repeat.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" "asobi-${{ matrix.target }}.tar.gz" --clobber; then
              exit 0
            fi
            echo "upload attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "upload failed after 5 attempts" >&2
          exit 1
