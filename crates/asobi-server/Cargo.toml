[package]
name = "asobi-server"
description = "The Asobi graph server: one process, named graphs, HTTP access (ADR 0005)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# cargo-binstall: the release archive `asobi-<target>.tar.gz` carries both
# binaries (the CLI and this server) at its root; the tag is `v<version>`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/asobi-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
asobi-core = { workspace = true }
asobi-storage = { workspace = true }
anyhow = { workspace = true }
axum = "0.8"
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
asobi = { path = "../asobi", features = ["remote"] }
sqlx = { workspace = true }
tempfile = { workspace = true }
