[workspace]
resolver = "2"
members = [
    "crates/asobi-core",
    "crates/asobi-storage",
    "crates/asobi",
    "crates/asobi-server",
]

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.94"
authors = ["haru <azusachino@proton.me>"]
license = "MIT"
repository = "https://github.com/azusachino/asobi"

# One version for the workspace; all four crates publish together (ADR 0009).
[workspace.dependencies]
asobi-core = { path = "crates/asobi-core", version = "0.8.1" }
asobi-storage = { path = "crates/asobi-storage", version = "0.8.1" }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = "4.6"
criterion = "0.8"
dhat = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "fs"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"      # Optimize for size
lto = true           # Link Time Optimization
codegen-units = 1    # Maximize LTO impact
strip = true         # Remove symbols
panic = "abort"      # Remove panic handling overhead
